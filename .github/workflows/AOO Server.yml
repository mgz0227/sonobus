name: AOO Server

on:
  pull_request:
    branches: [sonobus9]
  push:
    branches: [sonobus9]
  workflow_dispatch:

jobs:
  client:
    name: SonoBus client protocol compatibility (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure client
        shell: pwsh
        run: cmake -S . -B build-client -A x64 '-DAAX_SDK_PATH=./SDK/aax'

      - name: Build client formats
        shell: pwsh
        run: cmake --build build-client --config Release --target SonoBus_Standalone SonoBus_VST3 SonoBus_AAX --parallel

      - name: Package client formats
        shell: pwsh
        run: |
          Compress-Archive -Path 'build-client/SonoBus_artefacts/Release/Standalone/SonoBus.exe' -DestinationPath sonobus-standalone-windows-x64.zip
          Compress-Archive -Path 'build-client/SonoBus_artefacts/Release/VST3/SonoBus.vst3' -DestinationPath sonobus-vst3-windows-x64.zip
          Compress-Archive -Path 'build-client/SonoBus_artefacts/Release/AAX/SonoBus.aaxplugin' -DestinationPath sonobus-aax-windows-x64.zip

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonobus-standalone-windows-x64
          path: sonobus-standalone-windows-x64.zip
          if-no-files-found: error

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonobus-vst3-windows-x64
          path: sonobus-vst3-windows-x64.zip
          if-no-files-found: error

      - name: Upload AAX artifact
        uses: actions/upload-artifact@v4
        with:
          name: sonobus-aax-windows-x64
          path: sonobus-aax-windows-x64.zip
          if-no-files-found: error

  server:
    name: Dual-protocol AOO server (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            cmake_args: ''
            cxx_flags: ''
            binary: build-aoo/server/aooserver
            test_dir: build-aoo/tests
          - platform: windows-x64
            os: windows-latest
            cmake_args: -A x64
            cxx_flags: /EHsc /DOSC_HOST_LITTLE_ENDIAN
            binary: build-aoo/server/Release/aooserver.exe
            test_dir: build-aoo/tests/Release
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: cmake -S subdeps/aoo -B build-aoo -DAOO_BUILD_SERVER=ON -DAOO_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }} "-DCMAKE_CXX_FLAGS=${{ matrix.cxx_flags }}"

      - name: Build server and compatibility tests
        shell: pwsh
        run: cmake --build build-aoo --config Release --target aooserver test_wire_protocol test_dual_protocol_server test_legacy_media --parallel

      - name: Run compatibility tests
        shell: pwsh
        run: |
          $testDir = '${{ matrix.test_dir }}'
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          & "$testDir/test_wire_protocol$suffix"
          if ($LASTEXITCODE -ne 0) { throw 'Wire framing test failed' }
          & "$testDir/test_dual_protocol_server$suffix"
          if ($LASTEXITCODE -ne 0) { throw 'Dual-protocol control test failed' }
          & "$testDir/test_legacy_media$suffix"
          if ($LASTEXITCODE -ne 0) { throw 'Cross-generation media test failed' }

      - name: Check server contract (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = (Resolve-Path '${{ matrix.binary }}').Path
          $version = (& $binary --version 2>&1) -join "`n"
          $help = (& $binary --help 2>&1) -join "`n"
          if ($LASTEXITCODE -ne 0 -or $version -ne 'aooserver 2.0-test4') { throw "Unexpected aooserver version: $version" }
          if ($help -notmatch 'default = 10998') { throw "The server default port is not 10998: $help" }
          if ($help -notmatch 'default = 10996') { throw "The legacy server default port is not 10996: $help" }

          $log = Join-Path $PWD 'aooserver.log'
          $errorLog = Join-Path $PWD 'aooserver-error.log'
          $server = Start-Process -FilePath $binary -ArgumentList '-p', '19098', '--legacy-port', '19096', '-l', '2' -PassThru -RedirectStandardOutput $log -RedirectStandardError $errorLog -WindowStyle Hidden
          try {
            $current = $false
            $legacy = $false
            1..20 | ForEach-Object {
              $current = [bool](Get-NetUDPEndpoint -LocalPort 19098 -ErrorAction SilentlyContinue)
              $legacy = [bool](Get-NetUDPEndpoint -LocalPort 19096 -ErrorAction SilentlyContinue)
              if ($current -and $legacy) { return }
              Start-Sleep -Milliseconds 250
            }
            if (-not ($current -and $legacy)) { throw "aooserver did not bind both UDP ports`n$(Get-Content $log -Raw)`n$(Get-Content $errorLog -Raw)" }
          }
          finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: Check server contract (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          binary='${{ matrix.binary }}'
          version="$($binary --version)"
          help="$($binary --help)"
          test "$version" = "aooserver 2.0-test4"
          grep -F 'default = 10998' <<< "$help"
          grep -F 'default = 10996' <<< "$help"
          "$binary" -p 19098 --legacy-port 19096 -l 2 > aooserver.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            if ss -lun | grep -q ':19098' && ss -lun | grep -q ':19096'; then exit 0; fi
            sleep 0.25
          done
          cat aooserver.log
          exit 1

      - name: Package Linux server
        if: runner.os == 'Linux'
        shell: bash
        run: tar -C build-aoo/server -czf aooserver-dual-protocol-linux-x64.tar.gz aooserver

      - name: Package Windows server
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path '${{ matrix.binary }}' -DestinationPath aooserver-dual-protocol-windows-x64.zip

      - name: Upload dual-protocol server artifact
        uses: actions/upload-artifact@v4
        with:
          name: aooserver-dual-protocol-${{ matrix.platform }}
          path: aooserver-dual-protocol-${{ matrix.platform }}.*
          if-no-files-found: error
