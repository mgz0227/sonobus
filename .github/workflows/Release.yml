name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload (e.g. v1.0.0)"
        required: true
        default: 1.72.0

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ 配置项目
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -A x64 '-DAAX_SDK_PATH=./SDK/aax'

      # 3️⃣ 构建项目
      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      # 4️⃣ 打包构建产物为 zip
      - name: Package build artifacts
        shell: pwsh
        run: |
          $output = "SonoBus_${{ github.event.inputs.tag }}.zip"
          Compress-Archive -Path build/SonoBus_artefacts/Release/* -DestinationPath $output
          echo "ZIP_FILE=$output" >> $env:GITHUB_ENV

      # 5️⃣ 上传到指定 tag 的 Release
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          files: ${{ env.ZIP_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_MGZ0227 }}
